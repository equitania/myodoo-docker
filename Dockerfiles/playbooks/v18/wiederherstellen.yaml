# Test instance <- newest live backup, state 'wiederherstellen'. Odoo 18.
# Result: State saved before the last playbook run, neutralized.
# Generated by generate.py 1.0.0. Needs odoodev >= 0.75.7.
#
# Check first without changes: odoodev run wiederherstellen.yaml --dry-run
# Run as root:                 odoodev run wiederherstellen.yaml
version: "18"
on_error: stop
description: "Test instance, state wiederherstellen: State saved before the last playbook run, neutralized"

targets:
  test:
    db_container: test-db
    odoo_container: test-odoo
    db_name: test_db
    data_dir: /opt/odoo/test

steps:
  - name: "Stop test-odoo"
    command: container.stop
    args: { target: test, component: odoo }

  - name: "Restore newest backup (wiederherstellen)"
    command: server.restore
    args:
      target: test
      backup_source:
        mode: newest_in_dir
        dir: /opt/backups/prerestore
        pattern: "test_db_test-odoo_prerestore_*.tar.zst"
        select_by: filename_timestamp
      temp_dir: /opt/backups/restore-tmp
      drop: true
      template: template0
      deactivate_cron: true
      neutralize: true
      anonymize: false
      wipe: false
      purge_transactions: false
      purge_master_data: false

  - name: "Switch off EBICS (before Odoo starts)"
    command: sql.execute
    args:
      target: test
      statements:
        - "DO $$ BEGIN IF to_regclass('ebics_config') IS NOT NULL THEN UPDATE ebics_config SET active = false; END IF; IF to_regclass('ebics_userid') IS NOT NULL THEN UPDATE ebics_userid SET active = false, ebics_passphrase = NULL, ebics_sig_passphrase = NULL; END IF; END $$;"

  # update_docker_odoo.py (doup): builds the image, updates all modules on the
  # restored database and starts the container. --type F forces the full update.
  - name: "Rebuild image, update all modules, start test-odoo"
    command: server.rebuild
    args:
      target: test
      extra_args: ["--type", "F"]

  # A no-op when the database has no EBICS.
  - name: "Uninstall EBICS"
    command: server.uninstall
    args:
      target: test
      modules: [account_ebics, account_ebics_batch, account_ebics_oe]

  - name: "Neutralize (odoo-bin neutralize in the container)"
    command: server.neutralize
    args: { target: test }

  - name: "Verify that the test instance is up on the restored database"
    command: server.verify
    args: { target: test }
