# Test instance <- newest live backup, state 'vorlage'. Odoo 18.
# Result: Neutralized, transactions and customer/vendor/contact partners deleted (products, pricelists, users, company, config kept).
# Generated by generate.py 1.6.0. Needs odoodev >= 0.75.7.
#
# Check first without changes: odoodev run vorlage.yaml --dry-run
# Run as root:                 odoodev run vorlage.yaml
version: "18"
on_error: stop
description: "Test instance, state vorlage: Neutralized, transactions and customer/vendor/contact partners deleted (products, pricelists, users, company, config kept)"

targets:
  test:
    db_container: test-db
    odoo_container: test-odoo
    db_name: test_db
    data_dir: /opt/odoo/test

steps:
  - name: "Stop test-odoo"
    command: container.stop
    args: { target: test, component: odoo }

  - name: "Restore newest backup (vorlage)"
    command: server.restore
    args:
      target: test
      backup_source:
        mode: newest_in_dir
        dir: /opt/backups/docker
        pattern: "live_db_live-odoo_dockerbackup_????-??-??_??-??-??.7z"
        select_by: filename_timestamp
      temp_dir: /opt/backups/restore-tmp
      drop: true
      template: template0
      deactivate_cron: true
      neutralize: true
      anonymize: false
      wipe: false
      purge_transactions: false
      purge_master_data: true

  # update_docker_odoo.py (doup): builds the image, updates all modules on the
  # restored database and starts the container. --type F forces the full update.
  - name: "Rebuild image, update all modules, start test-odoo"
    command: server.rebuild
    args:
      target: test
      extra_args: ["--type", "F"]

  - name: "Switch cron jobs off again (the module update re-enabled them)"
    command: sql.execute
    args:
      target: test
      statements:
        - "UPDATE ir_cron SET active = false;"

  - name: "Neutralize (odoo-bin neutralize in the container)"
    command: server.neutralize
    args: { target: test }

  - name: "Verify that the test instance is up on the restored database"
    command: server.verify
    args: { target: test }
