# Test instance <- newest live backup, state 'passwoerter'. Odoo 18.
# Result: common test password for all users, 2FA off.
# Generated by generate.py 1.0.0. Needs odoodev >= 0.75.7.
# Prerequisite (once, and whenever the password changes): python3 passwort-setzen.py
#
# Check first without changes: odoodev run passwoerter.yaml --dry-run
# Run as root:                 odoodev run passwoerter.yaml
version: "18"
on_error: stop
description: "Test instance, state passwoerter: common test password for all users, 2FA off"

env_file: /root/.config/odoodev/test-passwords.env

targets:
  test:
    db_container: test-db
    odoo_container: test-odoo
    db_name: test_db
    data_dir: /opt/odoo/test

steps:
  - name: "Set the common password for every user"
    command: sql.execute
    args:
      target: test
      statements:
        - "DO $reset$ BEGIN IF '{{ env.TEST_PASSWORD_HASH }}' NOT LIKE '$pbkdf2-sha512$%' THEN RAISE EXCEPTION 'TEST_PASSWORD_HASH missing or invalid - run python3 passwort-setzen.py first'; END IF; UPDATE res_users SET password = '{{ env.TEST_PASSWORD_HASH }}' WHERE id > 0 AND login NOT IN ('__system__', 'default', 'public', 'portaltemplate'); END $reset$;"

  - name: "Switch off two-factor authentication for every user"
    command: sql.execute
    args:
      target: test
      statements:
        - "DO $totp$ BEGIN IF EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name = 'res_users' AND column_name = 'totp_secret') THEN UPDATE res_users SET totp_secret = NULL WHERE totp_secret IS NOT NULL; END IF; IF to_regclass('auth_totp_device') IS NOT NULL THEN DELETE FROM auth_totp_device; END IF; DELETE FROM ir_config_parameter WHERE key = 'auth_totp.policy'; END $totp$;"
