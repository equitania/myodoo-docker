# Test instance <- newest live backup, state 'anonym'. Odoo 16.
# Result: Neutralized, personal data replaced by fake values (logins kept).
# Generated by generate.py 1.7.0. Needs odoodev >= 0.75.7.
#
# Check first without changes: odoodev run anonym.yaml --dry-run
# Run as root:                 odoodev run anonym.yaml
version: "16"
on_error: stop
description: "Test instance, state anonym: Neutralized, personal data replaced by fake values (logins kept)"

targets:
  test:
    db_container: test-db
    odoo_container: test-odoo
    db_name: test_db
    data_dir: /opt/odoo/test

steps:
  # on_error: continue - on a new server the test container does not exist yet;
  # the rebuild creates it. A container that is still running is caught by
  # server.restore, which refuses to drop a database under a running Odoo.
  - name: "Stop test-odoo"
    command: container.stop
    args: { target: test, component: odoo }
    on_error: continue

  - name: "Restore newest backup (anonym)"
    command: server.restore
    args:
      target: test
      backup_source:
        mode: newest_in_dir
        dir: /opt/backups/docker
        pattern: "live_db_live-odoo_dockerbackup_????-??-??_??-??-??.7z"
        select_by: filename_timestamp
      temp_dir: /opt/backups/restore-tmp
      drop: true
      template: template0
      deactivate_cron: true
      neutralize: true
      anonymize: true
      wipe: false
      purge_transactions: false
      purge_master_data: false

  # update_docker_odoo.py (doup): builds the image, updates all modules on the
  # restored database and starts the container. --type F forces the full update.
  - name: "Rebuild image, update all modules, start test-odoo"
    command: server.rebuild
    args:
      target: test
      extra_args: ["--type", "F"]

  - name: "Switch cron jobs off again (the module update re-enabled them)"
    command: sql.execute
    args:
      target: test
      statements:
        - "UPDATE ir_cron SET active = false;"

  - name: "Neutralize (odoo-bin neutralize in the container)"
    command: server.neutralize
    args: { target: test }

  - name: "Verify that the test instance is up on the restored database"
    command: server.verify
    args: { target: test }
